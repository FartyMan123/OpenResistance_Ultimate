name: Dependency compatibility watch
on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview without creating labels or issues
        type: boolean
        default: false
permissions:
  contents: read
  issues: write
concurrency:
  group: dependency-compatibility-watch
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/tests/addon-dependencies
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test checker
        run: python -m unittest discover -s tests -v
      - name: Check dependency versions
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python check_dependencies.py --dry-run
          else
            python check_dependencies.py
          fi
